services:
  news-db:
    image: postgres:17
    container_name: sanctuary-news-cms-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-cms-test
      POSTGRES_DB: news_cms_preview
    ports:
      - '127.0.0.1:15440:5432'
    volumes:
      - news-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d news_cms_preview']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  news-data:
    name: sanctuary-news-cms-data
