name: API Pipeline

on:
  pull_request:
    branches:
      - dev
      - uat
      - prod
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/api-prod-deploy.yml"
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/api-prod-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: api-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run API tests
        run: mvn -q test
        working-directory: apps/api

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      API_ECR_REPOSITORY: ${{ vars.API_PROD_ECR_REPOSITORY }}
      API_ECS_SERVICE_NAME: ${{ vars.API_PROD_ECS_SERVICE_NAME }}
      API_ECS_CLUSTER: ${{ vars.API_PROD_ECS_CLUSTER }}
      SANCTUARY_DB_URL: ${{ vars.API_PROD_DB_URL }}
      SANCTUARY_DB_USERNAME: ${{ vars.API_PROD_DB_USERNAME }}
      API_PROD_DB_SECRET_ARN: ${{ vars.API_PROD_DB_SECRET_ARN || 'arn:aws:secretsmanager:us-east-1:160885294528:secret:rds!db-6969fe1c-0964-444f-b4f3-4fc2182887b5-xYENSU' }}
      SANCTUARY_AUTH_ENABLED: ${{ vars.API_PROD_AUTH_ENABLED || 'true' }}
      SANCTUARY_COGNITO_ISSUER_URI: ${{ vars.API_PROD_COGNITO_ISSUER_URI || 'https://cognito-idp.us-east-1.amazonaws.com/us-east-1_syYJKg0NY' }}
      SANCTUARY_COGNITO_CLIENT_ID: ${{ vars.API_PROD_COGNITO_CLIENT_ID || '7e3anthnuctm8p9nqck6kesjm9' }}
      SANCTUARY_AUTH_COOKIE_DOMAIN: ${{ vars.API_PROD_AUTH_COOKIE_DOMAIN || '.mydailysanctuary.com' }}
      SANCTUARY_AUTH_COOKIE_SAME_SITE: ${{ vars.API_PROD_AUTH_COOKIE_SAME_SITE || 'Lax' }}
      SANCTUARY_FIREBASE_NOTIFICATIONS_ENABLED: ${{ vars.API_PROD_FIREBASE_NOTIFICATIONS_ENABLED || 'true' }}
      API_PROD_FIREBASE_SERVICE_ACCOUNT_SECRET_ARN: ${{ vars.API_PROD_FIREBASE_SERVICE_ACCOUNT_SECRET_ARN || '' }}
      API_PUBLIC_HEALTH_URL: ${{ vars.API_PROD_PUBLIC_HEALTH_URL || 'https://api.mydailysanctuary.com/health' }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run API tests
        run: mvn -q test
        working-directory: apps/api

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Normalize deploy variables
        run: |
          echo "API_ECR_REPOSITORY=$(echo -n "${API_ECR_REPOSITORY}" | tr -d '\r\n[:space:]')" >> "$GITHUB_ENV"
          echo "API_ECS_SERVICE_NAME=$(echo -n "${API_ECS_SERVICE_NAME}" | tr -d '\r\n[:space:]')" >> "$GITHUB_ENV"
          echo "API_ECS_CLUSTER=$(echo -n "${API_ECS_CLUSTER}" | tr -d '\r\n[:space:]')" >> "$GITHUB_ENV"
          echo "SANCTUARY_DB_URL=$(echo -n "${SANCTUARY_DB_URL}" | tr -d '\r\n')" >> "$GITHUB_ENV"
          echo "SANCTUARY_DB_USERNAME=$(echo -n "${SANCTUARY_DB_USERNAME}" | tr -d '\r\n[:space:]')" >> "$GITHUB_ENV"
          echo "API_PROD_DB_SECRET_ARN=$(echo -n "${API_PROD_DB_SECRET_ARN}" | tr -d '\r\n[:space:]')" >> "$GITHUB_ENV"
          echo "SANCTUARY_AUTH_ENABLED=$(echo -n "${SANCTUARY_AUTH_ENABLED}" | tr -d '\r\n[:space:]')" >> "$GITHUB_ENV"
          echo "SANCTUARY_COGNITO_ISSUER_URI=$(echo -n "${SANCTUARY_COGNITO_ISSUER_URI}" | tr -d '\r\n[:space:]')" >> "$GITHUB_ENV"
          echo "SANCTUARY_COGNITO_CLIENT_ID=$(echo -n "${SANCTUARY_COGNITO_CLIENT_ID}" | tr -d '\r\n[:space:]')" >> "$GITHUB_ENV"
          echo "SANCTUARY_AUTH_COOKIE_DOMAIN=$(echo -n "${SANCTUARY_AUTH_COOKIE_DOMAIN}" | tr -d '\r\n[:space:]')" >> "$GITHUB_ENV"
          echo "SANCTUARY_AUTH_COOKIE_SAME_SITE=$(echo -n "${SANCTUARY_AUTH_COOKIE_SAME_SITE}" | tr -d '\r\n[:space:]')" >> "$GITHUB_ENV"
          echo "SANCTUARY_FIREBASE_NOTIFICATIONS_ENABLED=$(echo -n "${SANCTUARY_FIREBASE_NOTIFICATIONS_ENABLED}" | tr -d '\r\n[:space:]')" >> "$GITHUB_ENV"
          echo "API_PROD_FIREBASE_SERVICE_ACCOUNT_SECRET_ARN=$(echo -n "${API_PROD_FIREBASE_SERVICE_ACCOUNT_SECRET_ARN}" | tr -d '\r\n[:space:]')" >> "$GITHUB_ENV"
          echo "API_PUBLIC_HEALTH_URL=$(echo -n "${API_PUBLIC_HEALTH_URL}" | tr -d '\r\n[:space:]')" >> "$GITHUB_ENV"

      - name: Validate production DB secret source
        run: |
          if [[ "${API_PROD_DB_SECRET_ARN}" != arn:aws:secretsmanager:*:secret:rds\!* ]]; then
            echo "API_PROD_DB_SECRET_ARN must be the RDS-managed Secrets Manager secret ARN."
            echo "Do not use SSM parameters such as /sanctuary/prod/db/password for production DB credentials."
            exit 1
          fi
          if [[ "${SANCTUARY_FIREBASE_NOTIFICATIONS_ENABLED}" == "true" && "${API_PROD_FIREBASE_SERVICE_ACCOUNT_SECRET_ARN}" != arn:aws:secretsmanager:*:secret:* ]]; then
            echo "API_PROD_FIREBASE_SERVICE_ACCOUNT_SECRET_ARN must point to an AWS Secrets Manager secret containing the Firebase service account JSON."
            exit 1
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "EXPECTED_API_IMAGE=${ECR_REGISTRY}/${API_ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "API_LATEST_IMAGE=${ECR_REGISTRY}/${API_ECR_REPOSITORY}:latest" >> "$GITHUB_ENV"
          docker build -t "${ECR_REGISTRY}/${API_ECR_REPOSITORY}:${IMAGE_TAG}" -f apps/api/Dockerfile apps/api
          docker tag "${ECR_REGISTRY}/${API_ECR_REPOSITORY}:${IMAGE_TAG}" "${ECR_REGISTRY}/${API_ECR_REPOSITORY}:latest"

      - name: Smoke test API image startup
        run: |
          container_id=""

          cleanup() {
            if [[ -n "${container_id}" ]]; then
              docker logs "${container_id}" || true
              docker stop "${container_id}" >/dev/null 2>&1 || true
            fi
          }

          trap cleanup EXIT

          container_id="$(docker run -d \
            -p 18080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SPRING_FLYWAY_ENABLED=false \
            -e MANAGEMENT_HEALTH_DB_ENABLED=false \
            -e SANCTUARY_API_PORT=8080 \
            -e SANCTUARY_DB_URL="${SANCTUARY_DB_URL}" \
            -e SANCTUARY_DB_USERNAME="${SANCTUARY_DB_USERNAME}" \
            -e SANCTUARY_DB_PASSWORD=smoke-test \
            -e SANCTUARY_AUTH_ENABLED="${SANCTUARY_AUTH_ENABLED}" \
            -e SANCTUARY_COGNITO_ISSUER_URI="${SANCTUARY_COGNITO_ISSUER_URI}" \
            -e SANCTUARY_COGNITO_CLIENT_ID="${SANCTUARY_COGNITO_CLIENT_ID}" \
            -e SANCTUARY_AUTH_COOKIE_DOMAIN="${SANCTUARY_AUTH_COOKIE_DOMAIN}" \
            -e SANCTUARY_AUTH_COOKIE_SAME_SITE="${SANCTUARY_AUTH_COOKIE_SAME_SITE}" \
            -e SANCTUARY_FIREBASE_NOTIFICATIONS_ENABLED=false \
            "${EXPECTED_API_IMAGE}")"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health >/dev/null; then
              echo "API image startup smoke test passed."
              exit 0
            fi

            if ! docker ps --quiet --filter "id=${container_id}" | grep -q .; then
              echo "API image exited before becoming healthy."
              exit 1
            fi

            echo "Waiting for API image health ${attempt}/30..."
            sleep 2
          done

          echo "API image did not become healthy during smoke test."
          exit 1

      - name: Push API image
        run: |
          docker push "${EXPECTED_API_IMAGE}"
          docker push "${API_LATEST_IMAGE}"

      - name: Check for existing ECS production service
        run: |
          service_json="$(aws ecs describe-services \
            --cluster "${API_ECS_CLUSTER}" \
            --services "${API_ECS_SERVICE_NAME}" \
            --region "${AWS_REGION}")"

          service_status="$(echo "${service_json}" | jq -r '.services[0].status // "MISSING"')"
          echo "ECS production service status: ${service_status}"

          if [[ "${service_status}" != "ACTIVE" ]]; then
            echo "ECS production service ${API_ECS_SERVICE_NAME} was not found or is not active."
            exit 1
          fi

          current_task_definition="$(echo "${service_json}" | jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .taskDefinition')"
          target_group_arn="$(echo "${service_json}" | jq -r '.services[0].loadBalancers[0].targetGroupArn // ""')"
          echo "PRE_DEPLOY_TASK_DEFINITION=${current_task_definition}" >> "$GITHUB_ENV"
          echo "ECS_TARGET_GROUP_ARN=${target_group_arn}" >> "$GITHUB_ENV"
          echo "Current production task definition: ${current_task_definition}"
          echo "Current production target group: ${target_group_arn}"

      - name: Register ECS production task definition revision
        run: |
          aws ecs describe-task-definition \
            --task-definition "${PRE_DEPLOY_TASK_DEFINITION}" \
            --region "${AWS_REGION}" \
            --query taskDefinition > task-definition.json

          jq \
            --arg image "${EXPECTED_API_IMAGE}" \
            --arg db_url "${SANCTUARY_DB_URL}" \
            --arg db_username "${SANCTUARY_DB_USERNAME}" \
            --arg auth_enabled "${SANCTUARY_AUTH_ENABLED}" \
            --arg cognito_issuer "${SANCTUARY_COGNITO_ISSUER_URI}" \
            --arg cognito_client_id "${SANCTUARY_COGNITO_CLIENT_ID}" \
            --arg cookie_domain "${SANCTUARY_AUTH_COOKIE_DOMAIN}" \
            --arg cookie_same_site "${SANCTUARY_AUTH_COOKIE_SAME_SITE}" \
            --arg firebase_enabled "${SANCTUARY_FIREBASE_NOTIFICATIONS_ENABLED}" \
            --arg firebase_secret "${API_PROD_FIREBASE_SERVICE_ACCOUNT_SECRET_ARN}" \
            --arg db_secret "${API_PROD_DB_SECRET_ARN}:password::" \
            'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions |= map(
              if .name == "Main" then
                .image = $image
                | .environment = [
                  {"name": "SPRING_PROFILES_ACTIVE", "value": "prod"},
                  {"name": "SANCTUARY_API_PORT", "value": "8080"},
                  {"name": "SANCTUARY_DB_URL", "value": $db_url},
                  {"name": "SANCTUARY_DB_USERNAME", "value": $db_username},
                  {"name": "SANCTUARY_AUTH_ENABLED", "value": $auth_enabled},
                  {"name": "SANCTUARY_COGNITO_ISSUER_URI", "value": $cognito_issuer},
                  {"name": "SANCTUARY_COGNITO_CLIENT_ID", "value": $cognito_client_id},
                  {"name": "SANCTUARY_AUTH_COOKIE_DOMAIN", "value": $cookie_domain},
                  {"name": "SANCTUARY_AUTH_COOKIE_SAME_SITE", "value": $cookie_same_site},
                  {"name": "SANCTUARY_FIREBASE_NOTIFICATIONS_ENABLED", "value": $firebase_enabled}
                ]
                | .secrets = (
                  [{"name": "SANCTUARY_DB_PASSWORD", "valueFrom": $db_secret}]
                  + if $firebase_secret == "" then [] else [{"name": "SANCTUARY_FIREBASE_SERVICE_ACCOUNT_JSON", "valueFrom": $firebase_secret}] end
                )
              else
                .
              end
            )' task-definition.json > new-task-definition.json

          new_task_definition="$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --region "${AWS_REGION}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          echo "NEW_TASK_DEFINITION=${new_task_definition}" >> "$GITHUB_ENV"
          echo "Registered production task definition: ${new_task_definition}"

      - name: Deploy ECS production service
        run: |
          update_args=(
            --cluster "${API_ECS_CLUSTER}"
            --service "${API_ECS_SERVICE_NAME}"
            --task-definition "${NEW_TASK_DEFINITION}"
            --force-new-deployment
            --region "${AWS_REGION}"
          )

          if [[ -n "${ECS_TARGET_GROUP_ARN}" && "${ECS_TARGET_GROUP_ARN}" != "null" ]]; then
            update_args+=(--health-check-grace-period-seconds 300)
          fi

          aws ecs update-service "${update_args[@]}"

      - name: Verify ECS production rollout completed
        run: |
          service_json=""
          primary_rollout_state="UNKNOWN"
          primary_task_definition=""

          for attempt in {1..72}; do
            service_json="$(aws ecs describe-services \
              --cluster "${API_ECS_CLUSTER}" \
              --services "${API_ECS_SERVICE_NAME}" \
              --region "${AWS_REGION}")"

            primary_rollout_state="$(echo "${service_json}" | jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .rolloutState // "UNKNOWN"')"
            primary_task_definition="$(echo "${service_json}" | jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .taskDefinition')"

            echo "ECS rollout check ${attempt}/72: ${primary_rollout_state}"
            echo "Primary task definition: ${primary_task_definition}"

            if [[ "${primary_rollout_state}" == "COMPLETED" || "${primary_rollout_state}" == "FAILED" ]]; then
              break
            fi

            sleep 10
          done

          echo "Primary task definition: ${primary_task_definition}"
          echo "Primary rollout state: ${primary_rollout_state}"
          echo "Pre-deploy task definition: ${PRE_DEPLOY_TASK_DEFINITION}"

          if [[ "${primary_rollout_state}" != "COMPLETED" ]]; then
            echo "ECS production deployment did not complete successfully."
            echo "${service_json}" | jq '.services[0].deployments'
            exit 1
          fi

          if [[ "${primary_task_definition}" != "${NEW_TASK_DEFINITION}" ]]; then
            echo "ECS stabilized on an unexpected task definition."
            echo "Expected task definition: ${NEW_TASK_DEFINITION}"
            echo "Primary task definition: ${primary_task_definition}"
            echo "${service_json}" | jq '.services[0].deployments'
            exit 1
          fi

          if [[ "${primary_task_definition}" == "${PRE_DEPLOY_TASK_DEFINITION}" ]]; then
            echo "ECS stabilized on the pre-deploy task definition, which indicates rollback or no new revision."
            echo "${service_json}" | jq '.services[0].deployments'
            exit 1
          fi

          deployed_image="$(aws ecs describe-task-definition \
            --task-definition "${primary_task_definition}" \
            --region "${AWS_REGION}" \
            | jq -r '.taskDefinition.containerDefinitions[] | select(.name == "Main") | .image')"

          echo "Expected API image: ${EXPECTED_API_IMAGE}"
          echo "Deployed API image: ${deployed_image}"

          if [[ "${deployed_image}" != "${EXPECTED_API_IMAGE}" ]]; then
            echo "ECS stabilized, but the running task definition does not use the image built by this workflow."
            exit 1
          fi

          if [[ -z "${ECS_TARGET_GROUP_ARN}" || "${ECS_TARGET_GROUP_ARN}" == "null" ]]; then
            echo "No ECS target group was found for ${API_ECS_SERVICE_NAME}; skipping load balancer target health verification."
            exit 0
          fi

          target_health_json=""
          healthy_target_count="0"

          for attempt in {1..72}; do
            target_health_json="$(aws elbv2 describe-target-health \
              --target-group-arn "${ECS_TARGET_GROUP_ARN}" \
              --region "${AWS_REGION}")"
            healthy_target_count="$(echo "${target_health_json}" | jq '[.TargetHealthDescriptions[] | select(.TargetHealth.State == "healthy")] | length')"

            echo "Target health check ${attempt}/72: ${healthy_target_count} healthy target(s)"

            if [[ "${healthy_target_count}" -gt 0 ]]; then
              break
            fi

            echo "${target_health_json}" | jq '.TargetHealthDescriptions'
            sleep 10
          done

          if [[ "${healthy_target_count}" -lt 1 ]]; then
            echo "ECS production deployment completed, but no load balancer targets became healthy."
            echo "${target_health_json}" | jq '.TargetHealthDescriptions'
            exit 1
          fi

      - name: Verify public production API health
        run: |
          for attempt in {1..30}; do
            status_code="$(curl --silent --output /dev/null --write-out '%{http_code}' "${API_PUBLIC_HEALTH_URL}" || true)"
            echo "Public API health check ${attempt}/30: HTTP ${status_code}"

            if [[ "${status_code}" == "200" ]]; then
              exit 0
            fi

            sleep 10
          done

          echo "Production API public health check failed: ${API_PUBLIC_HEALTH_URL}"
          exit 1
