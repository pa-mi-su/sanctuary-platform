name: DEV Environment Control

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/scripts/dev-environment-control.sh"
      - ".github/scripts/test-dev-environment-control.sh"
      - ".github/workflows/api-dev-deploy.yml"
      - ".github/workflows/dev-environment-control.yml"
  workflow_dispatch:
    inputs:
      action:
        description: Choose what to do with the AWS DEV environment
        required: true
        type: choice
        options:
          - status
          - start
          - stop
  schedule:
    # 07:23 UTC is 03:23 Eastern during daylight time and 02:23 during standard time.
    # The nightly stop also catches RDS when AWS automatically restarts it after 7 days.
    - cron: "23 7 * * *"

permissions:
  contents: read

concurrency:
  group: sanctuary-dev-environment-control
  cancel-in-progress: false

jobs:
  validate:
    name: Validate DEV environment control
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate shell syntax
        run: |
          bash -n .github/scripts/dev-environment-control.sh
          bash -n .github/scripts/test-dev-environment-control.sh

      - name: Test lifecycle state transitions
        run: bash .github/scripts/test-dev-environment-control.sh

  control:
    name: ${{ github.event_name == 'schedule' && 'Nightly stop' || inputs.action }} DEV
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '160885294528' }}
      ECS_CLUSTER: ${{ vars.API_DEV_ECS_CLUSTER || 'sanctuary-dev' }}
      ECS_SERVICE: ${{ vars.API_DEV_ECS_SERVICE_NAME || 'sanctuary-api-dev' }}
      RDS_INSTANCE: sanctuary-dev-db
      DEV_HEALTH_URL: https://dev-api.mydailysanctuary.com/health
      CONTROL_ACTION: ${{ github.event_name == 'schedule' && 'stop' || inputs.action }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        id: aws_credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run DEV environment action
        run: bash .github/scripts/dev-environment-control.sh "${CONTROL_ACTION}"

      - name: Show final status
        if: always() && steps.aws_credentials.outcome == 'success'
        shell: bash
        run: |
          set +e
          final_status="$(bash .github/scripts/dev-environment-control.sh status 2>&1)"
          status_exit_code=$?
          echo "${final_status}"

          {
            echo "## DEV environment control"
            echo ""
            echo "- Requested action: \`${CONTROL_ACTION}\`"
            echo "- Status command exit code: \`${status_exit_code}\`"
            echo ""
            echo '```text'
            echo "${final_status}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
