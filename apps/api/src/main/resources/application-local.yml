spring:
  datasource:
    url: ${SANCTUARY_DB_URL:jdbc:postgresql://localhost:5432/sanctuary}
    username: ${SANCTUARY_DB_USERNAME:sanctuary}
    password: ${SANCTUARY_DB_PASSWORD:change-me-now}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SANCTUARY_COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_syYJKg0NY}

server:
  port: ${SANCTUARY_API_PORT:8080}

sanctuary:
  web:
    allowed-origins:
      - http://localhost:4200
      - http://127.0.0.1:4200
      - https://dev.mydailysanctuary.com
  auth:
    enabled: ${SANCTUARY_AUTH_ENABLED:true}
    audience: ${SANCTUARY_COGNITO_CLIENT_ID:7e3anthnuctm8p9nqck6kesjm9}
    user-pool-id: ${SANCTUARY_COGNITO_USER_POOL_ID:us-east-1_syYJKg0NY}
    client-id: ${SANCTUARY_COGNITO_CLIENT_ID:7e3anthnuctm8p9nqck6kesjm9}
    cookie:
      secure: ${SANCTUARY_AUTH_COOKIE_SECURE:false}
      same-site: ${SANCTUARY_AUTH_COOKIE_SAME_SITE:Lax}
      refresh-max-age-days: ${SANCTUARY_AUTH_COOKIE_REFRESH_MAX_AGE_DAYS:30}
