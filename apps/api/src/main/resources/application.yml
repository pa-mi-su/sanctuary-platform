spring:
  application:
    name: sanctuary-api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

sanctuary:
  news:
    challenge-key: ${SANCTUARY_NEWS_CHALLENGE_KEY:}
  auth:
    enabled: false
    audience: ""
    cookie:
      secure: true
      same-site: None
    abuse:
      enabled: true
      register:
        max-attempts: 5
        window: 1h
      login:
        max-attempts: 20
        window: 15m
      forgot-password:
        max-attempts: 5
        window: 1h
      resend-confirmation:
        max-attempts: 5
        window: 1h
      blocked-signup-domains:
        - example.com
        - example.org
        - example.net
        - test.com
        - invalid.com
